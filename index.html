<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanças do Casal</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--tx:#1d2330;--m:#6b7385;--bd:#e2e5ec;--ac:#2563eb;--ok:#16a34a;--w:#d97706;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#141821;--c:#1d2330;--tx:#e8ebf2;--m:#98a1b5;--bd:#2c3446;--ac:#5b8def;--ok:#34d399;--w:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:16px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:1 1 110px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
button{cursor:pointer}.p{background:var(--ac);color:#fff;border-color:var(--ac)}.big{font-size:21px;font-weight:700}.m{color:var(--m);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.r{color:var(--ok)}.d{color:var(--bad)}.x{border:0;background:none;color:var(--m);padding:2px 6px;flex:0}
#login{text-align:center;padding:60px 0}.hide{display:none}
</style></head><body><main>
<div id="login"><h1>💰 Finanças do Casal</h1><p class="m">Entre com a conta Google autorizada.</p><button class="p" id="in">Entrar com Google</button><p class="d" id="err"></p></div>

<div id="app" class="hide">
<div class="row" style="margin-bottom:12px"><h1 style="flex:2 1 200px">💰 Finanças do Casal</h1>
<input type="month" id="mes"><select id="pes"><option>Todos</option><option>Daniel</option><option>Regiane</option><option>Diversos</option></select><button id="out">Sair</button></div>

<div class="g g4"><div class="card"><div class="m">Receitas</div><div class="big r" id="kr"></div></div>
<div class="card"><div class="m">Despesas</div><div class="big d" id="kd"></div></div>
<div class="card"><div class="m">Saldo</div><div class="big" id="ks"></div></div>
<div class="card"><div class="m">Economia</div><div class="big" id="ke"></div></div></div>

<div class="g">
<div class="card"><h2>Novo lançamento</h2><div class="row">
<select id="ig"><option value="fixa">Despesa fixa</option><option value="parcela">Parcelada</option><option value="avulsa">Gasto avulso (1 vez)</option><option value="cartao">Fatura de cartão</option><option value="receita">Receita</option></select>
<input id="id" placeholder="Descrição" style="flex:2 1 160px"><input id="iv" type="number" step="0.01" placeholder="Valor">
<input id="idia" type="number" min="1" max="31" placeholder="Dia"><input id="ii" type="month"><input id="ip" type="number" min="0" placeholder="Parcelas (0 = sem fim)">
<select id="ipe"><option>Diversos</option><option>Daniel</option><option>Regiane</option></select><select id="icat"></select><button class="p" id="ai">Adicionar</button></div></div>
</div>

<div class="g">
<div class="card"><h2>Lançamentos do mês <span class="m">(✎ ajusta o valor só neste mês)</span></h2><div class="sc"><table><tbody id="li"></tbody></table></div></div>
<div class="card"><h2>Gastos por categoria</h2><div id="orc"></div>
</div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,deleteDoc,updateDoc,setDoc,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyA9CAw5fkwM5-wU5jKyXALJnM6oRig3ZVo",authDomain:"financas-pessoais-f6052.firebaseapp.com",projectId:"financas-pessoais-f6052",storageBucket:"financas-pessoais-f6052.firebasestorage.app",messagingSenderId:"235846742963",appId:"1:235846742963:web:f9877b71b6e66ca2d911c6"};

const $=i=>document.getElementById(i),brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const CATS=["Lanches","Mercantil","Açaí","Almoço","Merenda","Uber","Diversos"];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let itens=[],gastos=[],metas={economia:20,orc:{}},subs=[];
const hoje=new Date().toISOString().slice(0,10);
$("mes").value=$("ii").value=hoje.slice(0,7);
$("icat").innerHTML='<option value="">Categoria (opcional)</option>'+CATS.map(c=>`<option>${c}</option>`).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mi=s=>{const[a,b]=s.split("-");return a*12+ +b};
const ativo=(it,m)=>{const d=mi(m)-mi(it.inicio);return d>=0&&(!it.parcelas||d<it.parcelas)};
const val=(it,m)=>it.aj&&it.aj[m]!=null?it.aj[m]:it.valor;
const nome={fixa:"Fixa",parcela:"Parcela",cartao:"Cartão",avulsa:"Avulso",receita:"Receita"};

$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("err").textContent=e.message);
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 subs.forEach(f=>f());subs=[];
 $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);
 if(!u)return;
 const er=e=>{$("err").textContent="Sem permissão ou erro: "+e.message;$("login").classList.remove("hide");$("app").classList.add("hide")};
 subs.push(onSnapshot(collection(db,"itens"),s=>{itens=s.docs.map(d=>({id:d.id,...d.data()}));render()},er));
});

function render(){
 const m=$("mes").value,p=$("pes").value,pw=x=>{const dv=x.pessoa==="Diversos"||x.pessoa==="Casa";return p==="Todos"?1:p==="Diversos"?(dv?1:0):dv?.5:(x.pessoa===p?1:0)},f=x=>pw(x)>0;
 const I=itens.filter(i=>ativo(i,m)&&f(i)).sort((a,b)=>(a.dia||0)-(b.dia||0)); let rec=0,des=0;I.forEach(i=>i.grupo==="receita"?rec+=val(i,m)*pw(i):des+=val(i,m)*pw(i));
 const por={};I.forEach(i=>{if(i.grupo!=="receita"&&i.cat)por[i.cat]=(por[i.cat]||0)+val(i,m)*pw(i)});
 const sal=rec-des,eco=rec?sal/rec*100:0;
 $("kr").textContent=brl(rec);$("kd").textContent=brl(des);$("ks").textContent=brl(sal);$("ks").className="big "+(sal>=0?"r":"d");
 $("ke").textContent=eco.toFixed(1)+"%";$("ke").className="big "+(eco>=0?"r":"d");
 $("li").innerHTML=I.map(i=>`<tr><td>${i.dia?"Dia "+i.dia:""}</td><td>${esc(i.desc)}</td><td class="m">${nome[i.grupo]} · ${i.pessoa}${i.cat?" · "+i.cat:""}${pw(i)===.5?" ½":""}${i.parcelas>1?` · ${mi(m)-mi(i.inicio)+1}/${i.parcelas}`:""}</td><td class="${i.grupo==="receita"?"r":"d"}">${brl(val(i,m)*pw(i))}</td><td><button class="x" data-a="aj" data-id="${i.id}">✎</button><button class="x" data-a="del" data-c="itens" data-id="${i.id}">✕</button></td></tr>`).join("")||'<tr><td class="m">Nada neste mês.</td></tr>';
 $("orc").innerHTML=CATS.map(c=>{const g=por[c]||0,pc=des?g/des*100:0,cor="var(--ac)";
  return`<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between"><span>${c}</span><span class="m" style="text-align:right">${brl(g)}</span></div><div class="bar"><i style="width:${pc}%;background:${cor}"></i></div></div>`}).join("");
}
$("mes").onchange=$("pes").onchange=render;
document.body.onclick=async e=>{const b=e.target.closest("button[data-a]");if(!b)return;const{a,id,c}=b.dataset;
 if(a==="del"&&confirm("Excluir este lançamento?"))await deleteDoc(doc(db,c,id));
 if(a==="aj"){const m=$("mes").value,it=itens.find(x=>x.id===id),v=prompt("Valor para "+m+":",val(it,m));if(v!==null&&!isNaN(parseFloat(v)))await updateDoc(doc(db,"itens",id),{["aj."+m]:parseFloat(v.replace(",","."))})}};
$("ai").onclick=async()=>{const v=parseFloat($("iv").value);if(!v||!$("id").value||!$("ii").value)return alert("Preencha descrição, valor e mês inicial.");
 await addDoc(collection(db,"itens"),{grupo:$("ig").value,desc:$("id").value,valor:v,dia:+$("idia").value||0,inicio:$("ii").value,parcelas:$("ig").value==="avulsa"?1:+$("ip").value||0,cat:$("icat").value,pessoa:$("ipe").value});$("id").value=$("iv").value=""};
</script></main></body></html>
